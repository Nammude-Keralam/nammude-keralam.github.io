<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nammude — Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <section id="loginPage">

        <div class="login-box">

            <div class="login-logo">NAMMUDE</div>

            <div class="login-subtitle">Admin Dashboard</div>

            <label for="adminUsername">Username</label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Admin username"
                autocomplete="username"
            >

            <label for="adminPassword">Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin password"
                autocomplete="current-password"
            >

            <button class="login-btn" onclick="login()">
                Login
            </button>

            <div id="loginError">
                Invalid username or password
            </div>

        </div>

    </section>


    <!-- =====================================================
         ADMIN DASHBOARD
    ====================================================== -->

    <section id="dashboard">

        <header>

            <div class="header-left">

                <h1>Nammude Admin</h1>

                <p>Problem Reports Management</p>

            </div>

            <div class="header-buttons">

                <button
                    class="header-btn refresh-btn"
                    onclick="loadReports()"
                >
                    🔄 Refresh
                </button>

                <button
                    class="header-btn export-btn"
                    onclick="exportExcel()"
                >
                    📥 Export Excel
                </button>

                <button
                    class="header-btn logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </header>


        <main>

            <!-- =================================================
                 STATISTICS
            ================================================== -->

            <section class="stats">

                <div class="stat-card">
                    <div class="stat-title">Total Reports</div>
                    <div class="stat-number total" id="totalReports">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">Pending</div>
                    <div class="stat-number pending" id="pendingReports">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">In Progress</div>
                    <div class="stat-number progress" id="progressReports">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">Resolved</div>
                    <div class="stat-number resolved" id="resolvedReports">0</div>
                </div>

            </section>


            <!-- =================================================
                 SEARCH + FILTERS
            ================================================== -->

            <section class="controls">

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="🔎 Search reports..."
                    oninput="filterReports()"
                >

                <select
                    id="statusFilter"
                    onchange="filterReports()"
                >
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="in progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                </select>

                <select
                    id="categoryFilter"
                    onchange="filterReports()"
                >
                    <option value="all">All Categories</option>
                </select>

            </section>


            <!-- =================================================
                 REPORT TABLE
            ================================================== -->

            <section class="table-container">

                <div id="loading" class="loading">
                    Loading reports...
                </div>

                <table id="reportsTable" style="display: none;">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Location</th>
                            <th>Evidence</th>
                            <th>Voice</th>
                        </tr>

                    </thead>

                    <tbody id="reportsBody"></tbody>

                </table>

                <div
                    id="noData"
                    class="no-data"
                    style="display: none;"
                >
                    No reports found.
                </div>

            </section>

        </main>

    </section>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIG
        ====================================================== */

        const SUPABASE_URL =
            "https://ukbdqrvmdrlqqfqbnkle.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_Pc7qVHy1ojZFq795l2PmSg_6fm7M6Hf";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================================
           ADMIN LOGIN
        ====================================================== */

        const ADMIN_USERNAME =
            "Nammude_Admin";

        const ADMIN_PASSWORD =
            "__Home$6313#";


        /* =====================================================
           GLOBAL DATA
        ====================================================== */

        let allReports = [];


        /* =====================================================
           LOGIN
        ====================================================== */

        function login() {

            const username =
                document
                    .getElementById("adminUsername")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;

            const error =
                document.getElementById("loginError");

            error.style.display = "none";

            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                sessionStorage.setItem(
                    "nammude_admin",
                    "true"
                );

                document.getElementById("loginPage")
                    .style.display = "none";

                document.getElementById("dashboard")
                    .style.display = "block";

                loadReports();

            } else {

                error.style.display = "block";

            }

        }


        /* =====================================================
           ENTER KEY LOGIN
        ====================================================== */

        document
            .getElementById("adminPassword")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    login();
                }

            });


        /* =====================================================
           LOGOUT
        ====================================================== */

        function logout() {

            sessionStorage.removeItem("nammude_admin");

            location.reload();

        }


        /* =====================================================
           CHECK LOGIN
        ====================================================== */

        function checkLogin() {

            const loggedIn =
                sessionStorage.getItem("nammude_admin");

            if (loggedIn === "true") {

                document.getElementById("loginPage")
                    .style.display = "none";

                document.getElementById("dashboard")
                    .style.display = "block";

                loadReports();

            }

        }


        /* =====================================================
           LOAD REPORTS
        ====================================================== */

        async function loadReports() {

            const loading =
                document.getElementById("loading");

            const table =
                document.getElementById("reportsTable");

            const noData =
                document.getElementById("noData");

            loading.style.display = "block";
            table.style.display = "none";
            noData.style.display = "none";

            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("reports")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });

                if (error) {

                    console.error(
                        "Supabase error:",
                        error
                    );

                    loading.innerHTML =
                        "❌ Failed to load reports." +
                        "<br><br>" +
                        escapeHTML(error.message);

                    return;

                }

                allReports = data || [];

                updateStatistics();
                populateCategories();
                displayReports(allReports);

            }

            catch (error) {

                console.error("Error:", error);

                loading.innerHTML =
                    "❌ Something went wrong.";

            }

        }


        /* =====================================================
           UPDATE STATISTICS
        ====================================================== */

        function updateStatistics() {

            const total = allReports.length;

            const pending =
                allReports.filter(report =>
                    String(report.status || "")
                        .toLowerCase() === "pending"
                ).length;

            const progress =
                allReports.filter(report =>
                    String(report.status || "")
                        .toLowerCase()
                        .includes("progress")
                ).length;

            const resolved =
                allReports.filter(report =>
                    String(report.status || "")
                        .toLowerCase() === "resolved"
                ).length;

            document.getElementById("totalReports")
                .textContent = total;

            document.getElementById("pendingReports")
                .textContent = pending;

            document.getElementById("progressReports")
                .textContent = progress;

            document.getElementById("resolvedReports")
                .textContent = resolved;

        }


        /* =====================================================
           CATEGORY FILTER
        ====================================================== */

        function populateCategories() {

            const select =
                document.getElementById("categoryFilter");

            const categories = [
                ...new Set(
                    allReports
                        .map(report => report.category)
                        .filter(Boolean)
                )
            ];

            select.innerHTML = `
                <option value="all">All Categories</option>
            `;

            categories.forEach(category => {

                const option =
                    document.createElement("option");

                option.value = category;
                option.textContent = category;

                select.appendChild(option);

            });

        }


        /* =====================================================
           LOCATION HELPER
           Supports:
           latitude + longitude
           lat + lng
           location_latitude + location_longitude
           location_lat + location_lng
           coordinates
           location containing "lat,lng"
           Google Maps URLs
        ====================================================== */

        function getLocationHTML(report) {

            let latitude =
                report.latitude ??
                report.lat ??
                report.location_latitude ??
                report.location_lat ??
                null;

            let longitude =
                report.longitude ??
                report.lng ??
                report.location_longitude ??
                report.location_lng ??
                null;


            /* ---------------------------------------------
               1. DIRECT LATITUDE + LONGITUDE
            --------------------------------------------- */

            if (
                latitude !== null &&
                latitude !== undefined &&
                longitude !== null &&
                longitude !== undefined
            ) {

                const lat = Number(
                    String(latitude).trim()
                );

                const lng = Number(
                    String(longitude).trim()
                );

                if (
                    Number.isFinite(lat) &&
                    Number.isFinite(lng)
                ) {

                    return createMapButton(lat, lng);

                }

            }


            /* ---------------------------------------------
               2. COORDINATES FIELD
               Examples:
               "10.1234,76.1234"
               [10.1234,76.1234]
               {"lat":10.1234,"lng":76.1234}
            --------------------------------------------- */

            let coordinates =
                report.coordinates ??
                report.coordinate ??
                report.location_coordinates ??
                null;

            if (coordinates) {

                if (Array.isArray(coordinates)) {

                    if (coordinates.length >= 2) {

                        const lat = Number(coordinates[0]);
                        const lng = Number(coordinates[1]);

                        if (
                            Number.isFinite(lat) &&
                            Number.isFinite(lng)
                        ) {
                            return createMapButton(lat, lng);
                        }

                    }

                }


                if (typeof coordinates === "object") {

                    const lat =
                        Number(
                            coordinates.lat ??
                            coordinates.latitude
                        );

                    const lng =
                        Number(
                            coordinates.lng ??
                            coordinates.longitude
                        );

                    if (
                        Number.isFinite(lat) &&
                        Number.isFinite(lng)
                    ) {
                        return createMapButton(lat, lng);
                    }

                }


                if (typeof coordinates === "string") {

                    const match =
                        coordinates.match(
                            /(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/ 
                        );

                    if (match) {

                        const lat = Number(match[1]);
                        const lng = Number(match[2]);

                        if (
                            Number.isFinite(lat) &&
                            Number.isFinite(lng)
                        ) {
                            return createMapButton(lat, lng);
                        }

                    }

                }

            }


            /* ---------------------------------------------
               3. LOCATION FIELD
               Could be:
               "10.1234,76.1234"
               Google Maps URL
            --------------------------------------------- */

            const location =
                report.location ??
                report.location_url ??
                report.map_url ??
                null;

            if (location) {

                const locationString =
                    String(location).trim();


                /* Already a Google Maps URL */

                if (
                    locationString.includes(
                        "google.com/maps"
                    ) ||
                    locationString.includes(
                        "maps.google.com"
                    )
                ) {

                    return `
                        <a
                            class="action-btn map-btn"
                            href="${escapeHTML(locationString)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            📍 Map
                        </a>
                    `;

                }


                /* Coordinates inside location text */

                const match =
                    locationString.match(
                        /(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/ 
                    );

                if (match) {

                    const lat = Number(match[1]);
                    const lng = Number(match[2]);

                    if (
                        Number.isFinite(lat) &&
                        Number.isFinite(lng)
                    ) {
                        return createMapButton(lat, lng);
                    }

                }

            }


            return "-";

        }


        /* =====================================================
           CREATE GOOGLE MAP BUTTON
        ====================================================== */

        function createMapButton(latitude, longitude) {

            /*
             * Basic Kerala/India coordinate validation.
             * This prevents accidental invalid values.
             */

            if (
                latitude < -90 ||
                latitude > 90 ||
                longitude < -180 ||
                longitude > 180
            ) {

                return "-";

            }

            const mapURL =
                "https://www.google.com/maps?q=" +
                encodeURIComponent(
                    latitude + "," + longitude
                );

            return `
                <a
                    class="action-btn map-btn"
                    href="${mapURL}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📍 Map
                </a>
            `;

        }


        /* =====================================================
           EVIDENCE
        ====================================================== */

        function getEvidenceHTML(report) {

            let evidenceURL =
                report.evidence_url ??
                report.evidence ??
                null;

            if (!evidenceURL) {
                return "-";
            }


            /* Array */

            if (Array.isArray(evidenceURL)) {

                evidenceURL =
                    evidenceURL[0] || "";

            }


            /* JSON string array */

            if (
                typeof evidenceURL === "string" &&
                evidenceURL.trim().startsWith("[")
            ) {

                try {

                    const parsed =
                        JSON.parse(evidenceURL);

                    if (Array.isArray(parsed)) {
                        evidenceURL =
                            parsed[0] || "";
                    }

                } catch (error) {

                    console.error(
                        "Could not parse evidence URL:",
                        error
                    );

                }

            }


            evidenceURL =
                String(evidenceURL || "").trim();


            if (!evidenceURL) {
                return "-";
            }


            return `
                <a
                    class="action-btn evidence-btn"
                    href="${escapeHTML(evidenceURL)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📎 Open
                </a>
            `;

        }


        /* =====================================================
           VOICE
        ====================================================== */

        function getVoiceHTML(report) {

            let voiceURL =
                report.voice_url ??
                report.voice ??
                null;

            if (!voiceURL) {
                return "-";
            }


            if (Array.isArray(voiceURL)) {
                voiceURL = voiceURL[0] || "";
            }


            voiceURL =
                String(voiceURL || "").trim();


            if (!voiceURL) {
                return "-";
            }


            return `
                <a
                    class="action-btn voice-btn"
                    href="${escapeHTML(voiceURL)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🎤 Listen
                </a>
            `;

        }


        /* =====================================================
           DISPLAY REPORTS
        ====================================================== */

        function displayReports(reports) {

            const body =
                document.getElementById("reportsBody");

            const loading =
                document.getElementById("loading");

            const table =
                document.getElementById("reportsTable");

            const noData =
                document.getElementById("noData");

            body.innerHTML = "";

            loading.style.display = "none";


            if (!reports.length) {

                table.style.display = "none";
                noData.style.display = "block";

                return;

            }


            table.style.display = "table";
            noData.style.display = "none";


            reports.forEach(report => {

                const row =
                    document.createElement("tr");


                /* DATE */

                const date =
                    report.created_at
                        ? new Date(
                            report.created_at
                        ).toLocaleString("en-IN")
                        : "-";


                /* STATUS */

                const status =
                    String(
                        report.status || "Pending"
                    );


                let statusClass =
                    "status-default";


                if (
                    status.toLowerCase() ===
                    "pending"
                ) {

                    statusClass =
                        "status-pending";

                }

                else if (
                    status.toLowerCase()
                        .includes("progress")
                ) {

                    statusClass =
                        "status-progress";

                }

                else if (
                    status.toLowerCase() ===
                    "resolved"
                ) {

                    statusClass =
                        "status-resolved";

                }


                /* LOCATION */

                const mapHTML =
                    getLocationHTML(report);


                /* EVIDENCE */

                const evidenceHTML =
                    getEvidenceHTML(report);


                /* VOICE */

                const voiceHTML =
                    getVoiceHTML(report);


                /* ROW */

                row.innerHTML = `

                    <td>
                        ${escapeHTML(
                            report.id ?? "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(date)}
                    </td>

                    <td>
                        ${escapeHTML(
                            report.name ?? "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            report.phone ?? "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            report.category ?? "-"
                        )}
                    </td>

                    <td class="description">
                        ${escapeHTML(
                            report.description ?? "-"
                        )}
                    </td>

                    <td>
                        <span class="status ${statusClass}">
                            ${escapeHTML(status)}
                        </span>
                    </td>

                    <td>
                        ${mapHTML}
                    </td>

                    <td>
                        ${evidenceHTML}
                    </td>

                    <td>
                        ${voiceHTML}
                    </td>

                `;


                body.appendChild(row);

            });

        }


        /* =====================================================
           SEARCH + FILTER
        ====================================================== */

        function filterReports() {

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();


            const status =
                document
                    .getElementById("statusFilter")
                    .value
                    .toLowerCase();


            const category =
                document
                    .getElementById("categoryFilter")
                    .value;


            const filtered =
                allReports.filter(report => {

                    const searchableText =
                        Object.values(report)
                            .join(" ")
                            .toLowerCase();


                    const matchesSearch =
                        !search ||
                        searchableText.includes(search);


                    const reportStatus =
                        String(
                            report.status || ""
                        )
                        .toLowerCase();


                    let matchesStatus = true;


                    if (status !== "all") {

                        if (
                            status ===
                            "in progress"
                        ) {

                            matchesStatus =
                                reportStatus.includes(
                                    "progress"
                                );

                        }

                        else {

                            matchesStatus =
                                reportStatus === status;

                        }

                    }


                    const matchesCategory =
                        category === "all" ||
                        String(
                            report.category || ""
                        ) === category;


                    return (
                        matchesSearch &&
                        matchesStatus &&
                        matchesCategory
                    );

                });


            displayReports(filtered);

        }


        /* =====================================================
           EXPORT EXCEL
        ====================================================== */

        function exportExcel() {

            window.open(
                "export-excel.js",
                "_blank"
            );

        }


        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           START ADMIN
        ====================================================== */

        checkLogin();

    </script>

</body>

</html>
