<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nammude — Admin Dashboard</title>

    <!-- Nammude Admin CSS -->
    <link
        rel="stylesheet"
        href="admin.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <section id="loginPage">

        <div class="login-box">

            <div class="login-logo">
                NAMMUDE
            </div>

            <div class="login-subtitle">
                Admin Dashboard
            </div>


            <label for="adminUsername">
                Username
            </label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Admin username"
                autocomplete="username"
            >


            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin password"
                autocomplete="current-password"
            >


            <button
                class="login-btn"
                onclick="login()"
            >
                Login
            </button>


            <div id="loginError">
                Invalid username or password
            </div>

        </div>

    </section>



    <!-- =====================================================
         ADMIN DASHBOARD
    ====================================================== -->

    <section id="dashboard">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header>

            <div class="header-left">

                <h1>
                    Nammude Admin
                </h1>

                <p>
                    Problem Reports Management
                </p>

            </div>


            <div class="header-buttons">

                <button
                    class="header-btn refresh-btn"
                    onclick="loadReports()"
                >
                    🔄 Refresh
                </button>


                <button
                    class="header-btn export-btn"
                    onclick="exportExcel()"
                >
                    📥 Export Excel
                </button>


                <button
                    class="header-btn logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </header>



        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main>


            <!-- =================================================
                 STATISTICS
            ================================================== -->

            <section class="stats">


                <!-- TOTAL -->

                <div class="stat-card">

                    <div class="stat-title">
                        Total Reports
                    </div>

                    <div
                        class="stat-number total"
                        id="totalReports"
                    >
                        0
                    </div>

                </div>



                <!-- PENDING -->

                <div class="stat-card">

                    <div class="stat-title">
                        Pending
                    </div>

                    <div
                        class="stat-number pending"
                        id="pendingReports"
                    >
                        0
                    </div>

                </div>



                <!-- IN PROGRESS -->

                <div class="stat-card">

                    <div class="stat-title">
                        In Progress
                    </div>

                    <div
                        class="stat-number progress"
                        id="progressReports"
                    >
                        0
                    </div>

                </div>



                <!-- RESOLVED -->

                <div class="stat-card">

                    <div class="stat-title">
                        Resolved
                    </div>

                    <div
                        class="stat-number resolved"
                        id="resolvedReports"
                    >
                        0
                    </div>

                </div>

            </section>



            <!-- =================================================
                 SEARCH + FILTERS
            ================================================== -->

            <section class="controls">


                <!-- SEARCH -->

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="🔎 Search reports..."
                    oninput="filterReports()"
                >


                <!-- STATUS -->

                <select
                    id="statusFilter"
                    onchange="filterReports()"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="in progress">
                        In Progress
                    </option>

                    <option value="resolved">
                        Resolved
                    </option>

                </select>


                <!-- CATEGORY -->

                <select
                    id="categoryFilter"
                    onchange="filterReports()"
                >

                    <option value="all">
                        All Categories
                    </option>

                </select>

            </section>



            <!-- =================================================
                 REPORT TABLE
            ================================================== -->

            <section class="table-container">


                <!-- LOADING -->

                <div
                    id="loading"
                    class="loading"
                >
                    Loading reports...
                </div>



                <!-- TABLE -->

                <table
                    id="reportsTable"
                    style="display: none;"
                >

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Location
                            </th>

                            <th>
                                Evidence
                            </th>

                            <th>
                                Voice
                            </th>

                        </tr>

                    </thead>


                    <tbody id="reportsBody">
                    </tbody>

                </table>



                <!-- NO DATA -->

                <div
                    id="noData"
                    class="no-data"
                    style="display: none;"
                >
                    No reports found.
                </div>

            </section>

        </main>

    </section>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           SUPABASE CONFIG
        ====================================================== */

        const SUPABASE_URL =
            "https://ukbdqrvmdrlqqfqbnkle.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_Pc7qVHy1ojZFq795l2PmSg_6fm7M6Hf";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );



        /* =====================================================
           ADMIN LOGIN

           CHANGE THESE VALUES
        ====================================================== */

        const ADMIN_USERNAME =
            "Nammude_Admin";


        const ADMIN_PASSWORD =
            "__Home$6313#";



        /* =====================================================
           GLOBAL DATA
        ====================================================== */

        let allReports = [];



        /* =====================================================
           LOGIN
        ====================================================== */

        function login() {

            const username =
                document
                    .getElementById("adminUsername")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("adminPassword")
                    .value;


            const error =
                document.getElementById(
                    "loginError"
                );


            error.style.display = "none";


            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                sessionStorage.setItem(
                    "nammude_admin",
                    "true"
                );


                document.getElementById(
                    "loginPage"
                ).style.display = "none";


                document.getElementById(
                    "dashboard"
                ).style.display = "block";


                loadReports();

            }

            else {

                error.style.display = "block";

            }

        }



        /* =====================================================
           ENTER KEY LOGIN
        ====================================================== */

        document
            .getElementById("adminPassword")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        login();

                    }

                }
            );



        /* =====================================================
           LOGOUT
        ====================================================== */

        function logout() {

            sessionStorage.removeItem(
                "nammude_admin"
            );

            location.reload();

        }



        /* =====================================================
           CHECK LOGIN
        ====================================================== */

        function checkLogin() {

            const loggedIn =
                sessionStorage.getItem(
                    "nammude_admin"
                );


            if (loggedIn === "true") {

                document.getElementById(
                    "loginPage"
                ).style.display = "none";


                document.getElementById(
                    "dashboard"
                ).style.display = "block";


                loadReports();

            }

        }



        /* =====================================================
           LOAD REPORTS FROM SUPABASE
        ====================================================== */

        async function loadReports() {

            const loading =
                document.getElementById(
                    "loading"
                );


            const table =
                document.getElementById(
                    "reportsTable"
                );


            const noData =
                document.getElementById(
                    "noData"
                );


            loading.style.display = "block";

            table.style.display = "none";

            noData.style.display = "none";


            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("reports")

                    .select("*")

                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


                if (error) {

                    console.error(
                        "Supabase error:",
                        error
                    );


                    loading.innerHTML =
                        "❌ Failed to load reports." +
                        "<br><br>" +
                        escapeHTML(
                            error.message
                        );


                    return;

                }


                allReports =
                    data || [];


                updateStatistics();

                populateCategories();

                displayReports(
                    allReports
                );


            }

            catch (error) {

                console.error(
                    "Error:",
                    error
                );


                loading.innerHTML =
                    "❌ Something went wrong.";

            }

        }



        /* =====================================================
           UPDATE STATISTICS
        ====================================================== */

        function updateStatistics() {

            const total =
                allReports.length;


            const pending =
                allReports.filter(
                    report =>
                        String(
                            report.status || ""
                        )
                        .toLowerCase()
                        === "pending"
                ).length;


            const progress =
                allReports.filter(
                    report =>
                        String(
                            report.status || ""
                        )
                        .toLowerCase()
                        .includes("progress")
                ).length;


            const resolved =
                allReports.filter(
                    report =>
                        String(
                            report.status || ""
                        )
                        .toLowerCase()
                        === "resolved"
                ).length;



            document.getElementById(
                "totalReports"
            ).textContent = total;


            document.getElementById(
                "pendingReports"
            ).textContent = pending;


            document.getElementById(
                "progressReports"
            ).textContent = progress;


            document.getElementById(
                "resolvedReports"
            ).textContent = resolved;

        }



        /* =====================================================
           CATEGORY FILTER
        ====================================================== */

        function populateCategories() {

            const select =
                document.getElementById(
                    "categoryFilter"
                );


            const categories =
                [
                    ...new Set(
                        allReports
                            .map(
                                report =>
                                    report.category
                            )
                            .filter(Boolean)
                    )
                ];


            select.innerHTML = `
                <option value="all">
                    All Categories
                </option>
            `;


            categories.forEach(
                category => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        category;


                    option.textContent =
                        category;


                    select.appendChild(
                        option
                    );

                }
            );

        }



        /* =====================================================
           DISPLAY REPORTS
        ====================================================== */

        function displayReports(
            reports
        ) {

            const body =
                document.getElementById(
                    "reportsBody"
                );


            const loading =
                document.getElementById(
                    "loading"
                );


            const table =
                document.getElementById(
                    "reportsTable"
                );


            const noData =
                document.getElementById(
                    "noData"
                );


            body.innerHTML = "";


            loading.style.display =
                "none";


            if (!reports.length) {

                table.style.display =
                    "none";


                noData.style.display =
                    "block";


                return;

            }


            table.style.display =
                "table";


            noData.style.display =
                "none";



            reports.forEach(
                report => {

                    const row =
                        document.createElement(
                            "tr"
                        );



                    /* DATE */

                    const date =
                        report.created_at
                            ? new Date(
                                report.created_at
                            ).toLocaleString(
                                "en-IN"
                            )
                            : "-";



                    /* STATUS */

                    const status =
                        String(
                            report.status ||
                            "Pending"
                        );


                    let statusClass =
                        "status-default";


                    if (
                        status
                            .toLowerCase()
                            === "pending"
                    ) {

                        statusClass =
                            "status-pending";

                    }

                    else if (
                        status
                            .toLowerCase()
                            .includes(
                                "progress"
                            )
                    ) {

                        statusClass =
                            "status-progress";

                    }

                    else if (
                        status
                            .toLowerCase()
                            === "resolved"
                    ) {

                        statusClass =
                            "status-resolved";

                    }



                   


                    /* =========================
  /* =========================
   EVIDENCE
========================= */

let evidenceHTML = "-";

if (report.evidence_url) {

    let evidenceURL = report.evidence_url;

    // If Supabase stored it as an array
    if (Array.isArray(evidenceURL)) {
        evidenceURL = evidenceURL[0];
    }

    // If stored as JSON string:
    // ["https://....pdf"]
    if (
        typeof evidenceURL === "string" &&
        evidenceURL.trim().startsWith("[")
    ) {
        try {

            const parsed = JSON.parse(evidenceURL);

            if (Array.isArray(parsed)) {
                evidenceURL = parsed[0];
            }

        } catch (error) {

            console.error(
                "Could not parse evidence URL:",
                error
            );

        }
    }

    evidenceURL = String(evidenceURL || "").trim();

    if (evidenceURL) {

        evidenceHTML = `
            <a
                class="action-btn evidence-btn"
                href="${escapeHTML(evidenceURL)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                📎 Open
            </a>
        `;

    }

}



                    /* =================================================
                       VOICE
                    ================================================== */

                    let voiceHTML = "-";


                    if (
                        report.voice_url
                    ) {

                        voiceHTML = `
                            <a
                                class="action-btn voice-btn"
                                href="${escapeHTML(
                                    report.voice_url
                                )}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                🎤 Listen
                            </a>
                        `;

                    }



                    /* =================================================
                       ROW
                    ================================================= */

                    row.innerHTML = `

                        <td>
                            ${escapeHTML(
                                report.id ?? "-"
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                date
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                report.name ?? "-"
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                report.phone ?? "-"
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                report.category ?? "-"
                            )}
                        </td>


                        <td class="description">
                            ${escapeHTML(
                                report.description ?? "-"
                            )}
                        </td>


                        <td>

                            <span
                                class="status ${statusClass}"
                            >
                                ${escapeHTML(
                                    status
                                )}
                            </span>

                        </td>


                        <td>
                            ${mapHTML}
                        </td>


                        <td>
                            ${evidenceHTML}
                        </td>


                        <td>
                            ${voiceHTML}
                        </td>

                    `;


                    body.appendChild(
                        row
                    );

                }
            );

        }



        /* =====================================================
           SEARCH + FILTER
        ====================================================== */

        function filterReports() {

            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const status =
                document
                    .getElementById(
                        "statusFilter"
                    )
                    .value
                    .toLowerCase();


            const category =
                document
                    .getElementById(
                        "categoryFilter"
                    )
                    .value;



            const filtered =
                allReports.filter(
                    report => {


                        const searchableText =
                            Object.values(
                                report
                            )
                            .join(" ")
                            .toLowerCase();


                        const matchesSearch =
                            !search ||
                            searchableText.includes(
                                search
                            );


                        const reportStatus =
                            String(
                                report.status || ""
                            )
                            .toLowerCase();


                        let matchesStatus =
                            true;


                        if (
                            status !== "all"
                        ) {

                            if (
                                status ===
                                "in progress"
                            ) {

                                matchesStatus =
                                    reportStatus.includes(
                                        "progress"
                                    );

                            }

                            else {

                                matchesStatus =
                                    reportStatus ===
                                    status;

                            }

                        }


                        const matchesCategory =
                            category === "all" ||
                            String(
                                report.category ||
                                ""
                            ) === category;


                        return (
                            matchesSearch &&
                            matchesStatus &&
                            matchesCategory
                        );

                    }
                );


            displayReports(
                filtered
            );

        }



        /* =====================================================
           EXPORT EXCEL
        ====================================================== */

        function exportExcel() {

            /*
             * Your export-excel.js should handle
             * the actual Excel download.
             *
             * We will connect this properly next.
             */

            window.open(
                "export-excel.js",
                "_blank"
            );

        }



        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =====================================================
           START ADMIN
        ====================================================== */

        checkLogin();


    </script>


</body>

</html>
